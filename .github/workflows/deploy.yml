# Simple workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Legacy Pages publishing is currently also enabled for this repository.
  # Publish the compiled site after that job completes so raw source cannot win.
  workflow_run:
    workflows: ["pages build and deployment"]
    branches: ["main"]
    types: [completed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publishing-mode:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Choose the publishing trigger for the current Pages mode
        id: mode
        uses: actions/github-script@v7
        with:
          script: |
            let publish = true;
            if (context.eventName === 'push') {
              const { data } = await github.rest.repos.getPages(context.repo);
              if (!['legacy', 'workflow'].includes(data.build_type)) {
                throw new Error(`Unsupported Pages publishing mode: ${data.build_type}`);
              }
              publish = data.build_type === 'workflow';
              core.info(`Pages publishing mode: ${data.build_type}. Publish on push: ${publish}.`);
            }
            core.setOutput('publish', String(publish));

  # Build job
  build:
    needs: publishing-mode
    if: needs.publishing-mode.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp ./dist/index.html ./dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout verification script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js for published-site verification
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify both published product pages
        run: node scripts/verify-live-site.mjs


