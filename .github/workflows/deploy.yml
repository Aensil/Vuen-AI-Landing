# Simple workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publishing-mode:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Wait for legacy Pages before publishing the compiled site
        id: mode
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'push') {
              const { data } = await github.rest.repos.getPages(context.repo);
              if (!['legacy', 'workflow'].includes(data.build_type)) {
                throw new Error(`Unsupported Pages publishing mode: ${data.build_type}`);
              }
              core.info(`Pages publishing mode: ${data.build_type}.`);
              if (data.build_type === 'legacy') {
                let completed = false;
                for (let attempt = 0; attempt < 60; attempt++) {
                  const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                    ...context.repo,
                    head_sha: context.sha,
                    per_page: 20,
                  });
                  const legacy = runs.workflow_runs.find(run =>
                    run.path === 'dynamic/pages/pages-build-deployment'
                  );
                  if (legacy?.status === 'completed') {
                    core.info(`Legacy Pages run ${legacy.id} finished (${legacy.conclusion}); publishing compiled dist next.`);
                    completed = true;
                    break;
                  }
                  core.info(`Waiting for legacy Pages run for ${context.sha}: ${legacy?.status || 'not started'}.`);
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
                if (!completed) throw new Error('Legacy Pages did not finish within five minutes; refusing a competing deployment.');
              }
            }
            core.setOutput('publish', 'true');

  # Build job
  build:
    needs: publishing-mode
    if: needs.publishing-mode.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp ./dist/index.html ./dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout verification script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js for published-site verification
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify both published product pages
        run: node scripts/verify-live-site.mjs


